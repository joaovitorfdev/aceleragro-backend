[project]
name = "acelera-agro-backend"
version = "0.1.0"
description = "Acelera Agro API — rural credit proposal automation"
requires-python = ">=3.12"
dependencies = [
  "django>=5.1,<5.2",
  "django-ninja>=1.3",
  "django-ninja-jwt>=5.3",
  "psycopg[binary]>=3.2",
  "dj-database-url>=2.3",
  "django-cors-headers>=4.6",
  "django-storages[s3]>=1.14",
  "boto3>=1.35",
  "python-dotenv>=1.0",
  "reportlab>=4.2",
  "shapely>=2.0",
  "httpx>=0.28",
  "pydantic>=2.10",
  "pyjwt>=2.10",
  "pypdf>=5.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-django>=4.9",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "django-stubs>=5.1",
  "types-requests>=2.32",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acelera_agro"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "acelera_agro.settings"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "acelera_agro.settings"
